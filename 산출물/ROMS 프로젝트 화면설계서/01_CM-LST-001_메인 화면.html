<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROMS — Season Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --ink:#14141A; --ink-dim:#63626E; --ink-faint:#A6A5AE;
    --line:#E4E3DC; --cobalt:#2C4BFF; --yellow:#FFD23F;
    --tank:#3D5CFF; --dps:#FF3B4E; --support:#12B76A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', sans-serif; min-height:100vh; }
  .display{ font-family:'Archivo Black', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .topbar{
    display:flex; align-items:center; gap:24px; padding:22px 48px;
    border-bottom:1px solid var(--line);
  }
  .brand{ font-family:'Archivo Black'; font-size:18px; letter-spacing:0.01em; cursor:pointer; }
  .brand span{ color:var(--cobalt); }
  .nav-tabs{ display:flex; gap:26px; margin-left:12px; }
  .nav-tab{ font-size:13px; font-weight:700; color:var(--ink-faint); cursor:pointer; padding-bottom:4px; border-bottom:2px solid transparent; transition:all .15s; }
  .nav-tab:hover{ color:var(--ink); }
  .nav-tab.active{ color:var(--ink); border-color:var(--cobalt); }
  .search-wrap{ margin-left:auto; position:relative; width:220px; }
  .search-wrap input{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    padding:6px 22px 6px 2px; font-size:13px; color:var(--ink); outline:none;
  }
  .search-wrap input:focus{ border-color:var(--ink); }
  .search-wrap input::placeholder{ color:var(--ink-faint); }
  .search-wrap svg{ position:absolute; right:0; top:50%; transform:translateY(-50%); opacity:.5; width:14px; height:14px; }

  /* ---------------- poster hero ---------------- */
  .hero{ padding:56px 48px 40px; position:relative; overflow:hidden; }
  .hero-eyebrow{ font-family:'JetBrains Mono'; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cobalt); margin-bottom:14px; }
  .hero-row{ display:flex; align-items:flex-end; gap:24px; }
  .hero-num{ font-family:'Archivo Black'; font-size:min(22vw,220px); line-height:0.8; color:var(--ink); position:relative; }
  .hero-num::after{ content:'WINS'; position:absolute; right:6px; bottom:14px; font-family:'JetBrains Mono'; font-weight:700; font-size:15px; letter-spacing:0.1em; color:var(--cobalt); }
  .hero-info{ padding-bottom:18px; }
  .hero-name{ font-family:'Archivo Black'; font-size:30px; margin-bottom:8px; }
  .hero-meta{ font-size:13px; color:var(--ink-dim); margin-bottom:14px; }
  .hero-cta{
    display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border:none;
    padding:12px 20px; font-weight:700; font-size:13px; cursor:pointer; border-radius:2px; transition:background .15s;
  }
  .hero-cta:hover{ background:var(--cobalt); }
  .hero-rule{ position:absolute; right:0; top:0; bottom:0; width:220px; background:var(--yellow);
    transform:skewX(-8deg) translateX(60%); z-index:-1; opacity:0.5; }

  .content{ padding:0 48px 80px; max-width:1200px; }

  /* ---------------- editorial ranked list ---------------- */
  .section{ padding:36px 0; border-bottom:1px solid var(--line); }
  .section-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:22px; }
  .section-title{ font-family:'Archivo Black'; font-size:18px; }
  .section-sub{ font-size:12px; color:var(--ink-faint); margin-left:auto; }

  .rank-list{ display:flex; flex-direction:column; }
  .rank-row{
    display:grid; grid-template-columns:56px 1fr 120px 90px 90px; align-items:center;
    padding:16px 0; border-bottom:1px solid var(--line); cursor:pointer; transition:padding-left .15s;
  }
  .rank-row:hover{ padding-left:10px; }
  .rank-row:last-child{ border-bottom:none; }
  .rank-index{ font-family:'Archivo Black'; font-size:26px; color:var(--ink-faint); }
  .rank-index.top{ color:var(--cobalt); }
  .rank-player{ display:flex; align-items:center; gap:12px; }
  .role-mark{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .role-mark.tank{ background:var(--tank); } .role-mark.dps{ background:var(--dps); } .role-mark.support{ background:var(--support); }
  .rank-name{ font-weight:700; font-size:15px; }
  .rank-role{ font-size:11px; color:var(--ink-faint); margin-left:8px; }
  .rank-cell{ font-family:'JetBrains Mono'; font-size:13px; color:var(--ink-dim); }
  .rank-cell.wins{ font-weight:700; color:var(--ink); }

  /* ---------------- stat strip (no cards, hairline dividers) ---------------- */
  .stat-strip{ display:grid; grid-template-columns:repeat(6,1fr); }
  .stat-item{ padding:0 18px; border-right:1px solid var(--line); cursor:pointer; }
  .stat-item:first-child{ padding-left:0; }
  .stat-item:last-child{ border-right:none; padding-right:0; }
  .stat-label{ font-size:11px; color:var(--ink-faint); margin-bottom:10px; }
  .stat-value{ font-family:'Archivo Black'; font-size:32px; line-height:1; margin-bottom:6px; }
  .stat-name{ font-size:12px; color:var(--ink-dim); font-weight:700; }

  /* ---------------- match results editorial rows ---------------- */
  .match-row{ display:flex; align-items:center; gap:18px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .match-row:last-child{ border-bottom:none; }
  .match-tag{ font-family:'JetBrains Mono'; font-size:11px; color:var(--ink-faint); width:130px; flex-shrink:0; }
  .match-names{ flex:1; font-size:14px; font-weight:700; }
  .match-score{ font-family:'JetBrains Mono'; font-size:16px; font-weight:700; }
  .match-badge{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .match-badge.win{ background:rgba(18,183,106,0.1); color:var(--support); }
  .match-badge.lose{ background:rgba(255,59,78,0.1); color:var(--dps); }

  #toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; border-radius:3px; padding:12px 20px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:900px){
    .hero-row{ flex-direction:column; align-items:flex-start; gap:6px; }
    .hero-num{ font-size:26vw; }
    .stat-strip{ grid-template-columns:repeat(3,1fr); }
    .stat-item{ border-right:none; border-bottom:1px solid var(--line); padding:16px 0; }
    .rank-row{ grid-template-columns:36px 1fr 70px; }
    .rank-row :nth-child(4), .rank-row :nth-child(5){ display:none; }
    .topbar, .hero, .content{ padding-left:20px; padding-right:20px; }
    .nav-tabs{ display:none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand" onclick="showToast('홈으로 이동합니다')">RO<span>MS</span></div>
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="selectTab(this)">러너리그</div>
      <div class="nav-tab" onclick="selectTab(this)">라이벌클래시</div>
      <div class="nav-tab" onclick="selectTab(this)">랭킹</div>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="선수 검색" />
      <svg viewBox="0 0 24 24" fill="none" stroke="#14141A" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
  </div>

  <div class="hero">
    <div class="hero-rule"></div>
    <div class="hero-eyebrow">Season 05 · Runner League Champion</div>
    <div class="hero-row">
      <div class="hero-num">5</div>
      <div class="hero-info">
        <div class="hero-name">제타치즈</div>
        <div class="hero-meta">딜러 · 최다처치 60 · K/D 평균 2.4 · 승률 78%</div>
        <button class="hero-cta" onclick="showToast('제타치즈 상세화면으로 이동합니다')">전적 상세보기 →</button>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="section">
      <div class="section-head">
        <span class="section-title">러너리그 순위</span>
        <span class="section-sub">클릭 시 선수 상세화면으로 이동</span>
      </div>
      <div class="rank-list" id="rankList"></div>
    </div>

    <div class="section">
      <div class="section-head"><span class="section-title">이번 시즌 지표</span></div>
      <div class="stat-strip" id="statStrip"></div>
    </div>

    <div class="section" style="border-bottom:none;">
      <div class="section-head"><span class="section-title">최근 경기 결과</span></div>
      <div id="matchList"></div>
    </div>

  </div>

  <div id="toast"></div>

<script>
  const roleLabel = { tank:'탱커', dps:'딜러', support:'힐러' };

  const ranking = [
    {name:'제타치즈', role:'dps', wins:5, kda:'4.8', wr:'78%'},
    {name:'리코샤', role:'tank', wins:4, kda:'3.1', wr:'71%'},
    {name:'후니베어', role:'support', wins:3, kda:'5.2', wr:'66%'},
    {name:'폭풍우진', role:'dps', wins:3, kda:'4.1', wr:'64%'},
    {name:'미스틱캣', role:'tank', wins:2, kda:'2.9', wr:'58%'},
  ];
  document.getElementById('rankList').innerHTML = ranking.map((p,i)=>`
    <div class="rank-row" onclick="showToast('${p.name} 상세화면으로 이동합니다')">
      <span class="rank-index ${i===0?'top':''}">${String(i+1).padStart(2,'0')}</span>
      <div class="rank-player">
        <span class="role-mark ${p.role}"></span>
        <span class="rank-name">${p.name}</span>
        <span class="rank-role">${roleLabel[p.role]}</span>
      </div>
      <span class="rank-cell wins">${p.wins} WINS</span>
      <span class="rank-cell">KDA ${p.kda}</span>
      <span class="rank-cell">${p.wr}</span>
    </div>`).join('');

  const highlights = [
    {label:'최다처치', value:'60', name:'제타치즈'},
    {label:'최다도움', value:'30', name:'후니베어'},
    {label:'최다죽음', value:'15', name:'산왕이'},
    {label:'최다피해', value:'20k', name:'폭풍우진'},
    {label:'최다치유', value:'30k', name:'리코샤'},
    {label:'최다경감', value:'40k', name:'미스틱캣'},
  ];
  document.getElementById('statStrip').innerHTML = highlights.map(h=>`
    <div class="stat-item" onclick="showToast('${h.name} 상세화면으로 이동합니다')">
      <div class="stat-label">${h.label}</div>
      <div class="stat-value">${h.value}</div>
      <div class="stat-name">${h.name}</div>
    </div>`).join('');

  const matches = [
    {tag:'RUNNER · W5', names:'제타치즈 vs 산왕이', score:'3 : 1', result:'win'},
    {tag:'RIVAL · 8강', names:'리코샤 vs 노을빛', score:'2 : 3', result:'lose'},
    {tag:'RUNNER · W4', names:'후니베어 vs 폭풍우진', score:'3 : 2', result:'win'},
    {tag:'RIVAL · 4강', names:'미스틱캣 vs 제타치즈', score:'1 : 3', result:'lose'},
  ];
  document.getElementById('matchList').innerHTML = matches.map(m=>`
    <div class="match-row" onclick="showToast('매치 상세 결과로 이동합니다')">
      <span class="match-tag">${m.tag}</span>
      <span class="match-names">${m.names}</span>
      <span class="match-score">${m.score}</span>
      <span class="match-badge ${m.result}">${m.result==='win'?'승리':'패배'}</span>
    </div>`).join('');

  function selectTab(el){
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    showToast(el.textContent.trim()+' 화면으로 이동합니다');
  }
  let toastTimer;
  function showToast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
  }
  document.getElementById('searchInput').addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.value.trim()) showToast(`"${e.target.value.trim()}" 검색 결과로 이동합니다`);
  });
</script>
</body>
</html>
